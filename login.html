<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فرم ورود</title>
    <link rel="stylesheet" href="src/output.css">
</head>

<body class="flex min-h-screen items-center justify-center bg-linear-to-br from-indigo-500 to-purple-700 p-5 vazir-font">

    <main class="w-full max-w-md rounded-3xl bg-white p-8 shadow-2xl">
        <h1 class="mb-2 text-center text-3xl font-bold text-gray-800">
            ورود به حساب کاربری
        </h1>

        <p class="mb-8 text-center text-sm text-gray-500">نام و ایمیل خود را وارد کنید</p>

        <form class="login-form space-y-5">

            <div class="form-group">
                <label class="mb-2 block text-sm font-bold text-gray-700" for="name">نام کاربری</label>

                <input class="w-full rounded-xl border border-gray-300 px-4 py-3 text-sm outline-none transition focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100" type="text" id="name" name="name" placeholder="نام کاربری خود را وارد کنید" required >
            </div>

            <div class="form-group">
                <label class="mb-2 block text-sm font-bold text-gray-700" for="email">ایمیل</label>

                <input class="w-full rounded-xl border border-gray-300 px-4 py-3 text-sm outline-none transition focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100" type="email" id="email" name="email" placeholder="example@email.com" required>
            </div>

            <button class="submit-button w-full rounded-xl bg-linear-to-l from-indigo-600 to-purple-600 px-4 py-3 font-bold text-white transition hover:-translate-y-1 hover:shadow-lg focus:outline-none focus:ring-4 focus:ring-indigo-200 cursor-pointer" type="submit">ورود</button>

            <p class="login-message min-h-6 text-center text-sm font-bold hidden"></p>
        </form>
    </main>

    <script src="assets/js/login.js"></script>
</body>
</html>
