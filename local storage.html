<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>local storage</title>
    <link rel="stylesheet" href="src/output.css">
</head>
<body dir="rtl" class="vazir-font flex items-center justify-center flex-col gap-3 h-screen">
    <h1 class="text-3xl font-bold" id="title">سلام کاربر!</h1>
    <input type="text" placeholder="نام خود را وارد کنید" class="border border-gray-400 bg-white rounded-lg p-2" id="nameInput">
    <button class="rounded-lg p-2 bg-lime-500 text-white hover:bg-lime-600 transition-all duration-700 cursor-pointer border border-white" id="saveNameBtn">ذخیره نام</button>

    <h2 class="text-xl font-bold mt-5">انتخاب رنگ پس زمینه</h2>
    <button class="rounded-lg p-2 bg-blue-500 text-white hover:bg-blue-600 transition-all duration-700 cursor-pointer border border-white" id="blueBtn">آبی</button>
    <button class="rounded-lg p-2 bg-red-500 text-white hover:bg-red-600 transition-all duration-700 cursor-pointer border border-white" id="redBtn">قرمز</button>
    
    <script src="assets/js/local storage.js"></script>

</html>
